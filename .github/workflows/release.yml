name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST="v$(jq -r .version extension/manifest.json)"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $TAG does not match manifest version $MANIFEST"
            exit 1
          fi

      - name: Build zip
        run: |
          ZIP="chrome-directions-to-${GITHUB_REF_NAME}.zip"
          (cd extension && zip -r -X "../$ZIP" .)
          unzip -l "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --generate-notes
